<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — Muslim Will</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/shell.css">
<style>
  /* Home: greeting + ONE primary card + what you have (2+ products) + at most ONE recommendation.
     Tokens, sidebar, top bar and the phone tab bar come from shared/shell.css. */
  body { font-size: 17px; }

  .content { width: 100%; max-width: 1000px; margin: 12px auto 64px; padding: 0 40px; display: flex; flex-direction: column; gap: 24px; }
  .greet { font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1.1; letter-spacing: -.01em; margin-top: 8px; }

  /* Primary card */
  .focus { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 32px 36px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 20px 40px; align-items: end; }
  .focus.warn { border-color: #E7C9C6; }
  .focus .tx { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .lab { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
  .lab.chip { align-self: flex-start; padding: 6px 14px 6px 10px; border-radius: 999px; }
  .t-gold { color: var(--gold-ink); } .t-ok { color: var(--ok); } .t-warn { color: var(--warn); }
  .lab.chip.t-ok { background: var(--ok-bg); } .lab.chip.t-warn { background: var(--warn-bg); } .lab.chip.t-gold { background: var(--gold-bg); }
  .focus h2 { font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1.12; text-wrap: balance; }
  .sup { font-size: 18px; line-height: 1.5; color: var(--muted); }
  .seg { display: flex; gap: 6px; max-width: 420px; margin-top: 4px; }
  .seg i { flex: 1; height: 7px; border-radius: 4px; background: var(--line); } .seg i.d { background: var(--gold); }
  .segt { font-size: 16px; font-weight: 600; color: var(--muted); }
  .steps { list-style: none; display: flex; gap: 0; margin: 8px 0 4px; flex-wrap: wrap; row-gap: 10px; }
  .steps li { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--muted); white-space: nowrap; }
  .steps li:not(:last-child)::after { content: ''; width: 24px; height: 2px; background: var(--line); margin: 0 10px; }
  .steps .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #DDD6CA; background: var(--surface); display: grid; place-items: center; color: #fff; flex: none; }
  .steps li.d { color: var(--ink); } .steps li.d .dot { background: var(--ok); border-color: var(--ok); }
  .steps li.c { color: var(--ink); font-weight: 700; } .steps li.c .dot { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-bg); }
  .focus .acts { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .btn { min-height: 56px; padding: 0 30px; border: 0; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 17px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--ink-2); }
  .lnk { min-height: 48px; border: 0; background: none; font-size: 17px; font-weight: 700; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: 6px; text-align: left; }

  /* What you have + one recommendation */
  .lower { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 24px; align-items: stretch; }
  .block { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .block h3 { font-size: 18px; font-weight: 800; }
  .rows { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 18px; gap: 16px; align-items: center; min-height: 76px; padding: 14px 18px; text-decoration: none; color: var(--ink); }
  .row + .row { border-top: 1px solid var(--line); }
  .row:hover { background: #FFFDF9; }
  .row .ri { width: 44px; height: 44px; border-radius: 14px; background: var(--tint); display: grid; place-items: center; }
  .row b { display: block; font-size: 17px; }
  .row small { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600; }
  .row .rc { color: var(--muted); }
  .sugg { position: relative; container-type: inline-size; border-radius: 24px; border: 1px solid #EADFCB; background: #FEF5EA; padding: 28px 30px; min-height: 220px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .sugg .art { position: absolute; inset: 0; background: no-repeat right bottom / auto 96%; pointer-events: none; }
  .sugg.art-vault .art { background-image: url('brand%20asssets/home-banner-vault.png'); }
  .sugg.art-family .art { background-image: url('brand%20asssets/home-banner-family.png'); }
  .sugg .tx { position: relative; max-width: 58%; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .sugg .eb { font-size: 16px; font-weight: 700; color: var(--gold-ink); }
  .sugg h3 { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.15; text-wrap: balance; }
  .sugg p { font-size: 17px; line-height: 1.45; color: var(--muted); }
  .sugg .btn { min-height: 50px; padding: 0 24px; margin-top: 6px; }
  .sugg .lnk { margin-top: 2px; }
  /* narrow banner (beside "Your plan", or on a phone): the picture steps back so the words keep their room */
  @container (max-width: 480px) {
    .sugg .art { background-size: auto 62%; }
    .sugg .tx { max-width: 66%; }
    .sugg h3 { font-size: 24px; }
  }
  /* phone: words on top at full width, picture in a band underneath */
  @container (max-width: 380px) {
    .sugg .tx { max-width: none; padding-bottom: 124px; }
    .sugg .art { background-size: auto 132px; }
    .sugg .btn { white-space: nowrap; }
  }

  @media (max-width: 900px) {
    .content { padding: 0 20px; margin-bottom: 32px; gap: 20px; }
    .focus { grid-template-columns: minmax(0, 1fr); padding: 24px; }
    .focus h2 { font-size: 30px; }
    .focus .acts { align-items: stretch; }
    .btn { white-space: normal; text-align: center; padding: 10px 24px; }
    .steps { flex-direction: column; row-gap: 12px; }
    .steps li:not(:last-child)::after { display: none; }
    .greet { font-size: 34px; }
  }
</style>
</head>
<body>
<a class="skip" href="#home">Skip to content</a>
<aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>

<div class="main">
  <header class="topbar" id="topbar"></header>
  <main class="content" id="home"></main>
</div>

<script src="vault/config.js"></script>
<script src="vault/mock-api.js"></script>
<script src="vault/store.js"></script>
<script src="shared/shell.js"></script>
<script>
(function () {
  /* HOME RULES
     1. One primary card. First match wins: something blocked on the user → a dated appointment → continue the Will →
        sign the Will → the next My Vault step → a waiting status → a calm "up to date".
        A task the user can act on always beats a status they can only wait on.
     2. "Your plan" lists only what the user owns, and only when they own 2+ products.
     3. At most one recommendation, never about the same thing as the primary card, never for something already owned,
        and never while a Will task is open.
     Demo states below; in production this comes from GET /home. */
  var VN = {
    start:  { kind: 'start', title: 'Set up your Vault step by step.', text: 'A few simple questions, one at a time.', cta: 'Start guided setup', href: '#/guided' },
    people: { kind: 'people', title: 'Add a trusted person.', text: 'Choose who should receive your information.', cta: 'Add a trusted person', href: '#/people/new' },
    done:   { kind: 'done' }
  };
  var DONE = { stage: 'complete', self: true };
  var STATES = {
    live:        { label: 'Live · uses My Vault data', live: true },
    notstarted:  { label: 'New · nothing started', first: true, will: null, vault: null },
    vaultentry:  { label: 'New · came for My Vault', first: true, intent: 'vault', will: null, vault: null },
    drafting:    { label: 'Will in progress', will: { stage: 'drafting', done: 1 }, vault: null },
    action:      { label: 'Scholar has a question', will: { stage: 'review', step: 1, action: true }, vault: null },
    review:      { label: 'In scholar review', will: { stage: 'review', step: 1 }, vault: null },
    legal:       { label: 'In legal review', will: { stage: 'review', step: 2 }, vault: null },
    ready:       { label: 'Ready to sign', will: { stage: 'ready' }, vault: null },
    booked:      { label: 'Signing booked', will: { stage: 'booked' }, vault: null },
    done:        { label: 'Will complete · no Vault', will: DONE, vault: null },
    attested:    { label: 'Will attested · no Vault', will: { stage: 'complete' }, vault: null },
    reviewvault: { label: 'Will in review + Vault to set up', will: { stage: 'review', step: 1 }, vault: { next: VN.start } },
    willvault:   { label: 'Will + Vault · getting started', will: DONE, vault: { next: VN.start } },
    people:      { label: 'Will + Vault · no trusted person', will: DONE, vault: { next: VN.people } },
    allset:      { label: 'Will + Vault · all set', will: DONE, vault: { next: VN.done } },
    yearly:      { label: 'Will + Vault · yearly review due', will: DONE, vault: { next: VN.done, reviewDue: true } },
    vaultonly:   { label: 'Vault only', will: null, vault: { next: VN.start } },
    billing:     { label: 'Vault payment problem', will: DONE, vault: { next: VN.done, billing: true } }
  };
  var CH = ['About You', 'Family', 'Trusted People', 'Bequests', 'Witnesses', 'Review'];
  var REVIEW = ['Submitted', 'Scholar review', 'Legal review', 'Ready to sign'];

  // Live state: the Will is a demo (complete); My Vault comes from the real Vault store.
  function liveState() {
    var V = window.VaultStore.sel, s = V.state();
    return { will: DONE, vault: s.subscribed ? { next: V.nextAction() } : null };
  }

  function ic(n, s) { s = s || 18; return '<svg width="' + s + '" height="' + s + '" aria-hidden="true"><use href="#' + n + '"/></svg>'; }

  /* The one primary card. kind: 'do' (the user can act) · 'wait' (nothing to do) · 'done'. */
  function primary(st) {
    var w = st.will, v = st.vault, vTask = v && v.next.kind !== 'done';
    if (v && v.billing) return { kind: 'do', urgent: true, tone: 'warn', chip: true, lab: 'Payment needed', li: 'i-alert', h: 'We couldn’t renew My Vault.', p: 'Update your payment to keep it active.', cta: 'Update payment', href: 'vault.html#/settings', about: 'vault' };
    if (w && w.action) return { kind: 'do', urgent: true, chip: true, lab: 'Needs your answer', li: 'i-help', h: 'Your scholar has a question.', p: 'Your review continues once you answer.', cta: 'Answer the question', soon: 'Scholar questions', about: 'will' };
    if (w && w.stage === 'booked') return { kind: 'do', lab: 'Signing booked', li: 'i-cal', h: 'Your signing appointment', p: 'Thursday 20 November · 2:00 PM · Online', cta: 'View appointment', soon: 'Your appointment', about: 'will' };
    if (!w && !v && st.intent === 'vault') return { kind: 'do', lab: 'My Vault', li: 'i-vault', h: 'Keep your estate organized.', p: 'One private place for what your family will need.', cta: 'See how it works', href: 'vault.html#/discover', about: 'vault' };
    if (!w && !v) return { kind: 'do', lab: 'Islamic Will · free', li: 'i-doc', h: 'Start your Islamic Will.', p: 'Free to create and print.', cta: 'Start my free Will', soon: 'My Will', about: 'will' };
    if (w && w.stage === 'drafting') return { kind: 'do', lab: 'Islamic Will', li: 'i-doc', h: 'Continue your Will.', p: 'Next: ' + CH[w.done], seg: w.done, cta: 'Continue ' + CH[w.done], soon: 'My Will', about: 'will' };
    if (w && w.stage === 'ready') return { kind: 'do', lab: 'Islamic Will', li: 'i-pen', h: 'Your Will is ready to sign.', p: 'Sign at home, or with a notary.', cta: 'Continue to signing', soon: 'Signing', about: 'will' };
    if (vTask) return { kind: 'do', lab: 'My Vault · next step', li: 'i-vault', h: v.next.title, p: v.next.text, cta: v.next.cta, href: 'vault.html' + v.next.href, about: 'vault' };
    if (w && w.stage === 'review') return { kind: 'wait', lab: 'In review', li: 'i-clock', h: 'Your Will is in review.', step: w.step, p: 'We’ll email you when it’s ready to sign.', about: 'will' };
    if (w && v) return { kind: 'done', tone: 'ok', chip: true, lab: 'Up to date', li: 'i-check', h: 'Your plan is up to date.', p: 'Review it when life changes.', about: 'plan' };
    if (w) return { kind: 'done', tone: 'ok', chip: true, lab: w.self ? 'Signed at home' : 'Attested and stored', li: 'i-check', h: 'Your Islamic Will is complete.', p: 'View or update it anytime.', cta: 'View my Will', soon: 'My Will', about: 'will' };
    return { kind: 'done', tone: 'ok', chip: true, lab: 'Up to date', li: 'i-check', h: 'My Vault is up to date.', p: 'Review it when life changes.', cta: 'Open My Vault', href: 'vault.html#/overview', about: 'vault' };
  }

  // What the user owns, in plain words (no counts or percentages).
  function planRows(st) {
    var r = [], w = st.will, v = st.vault;
    if (w) {
      var t = w.action ? 'Needs your answer' : { drafting: 'In progress', review: 'In ' + REVIEW[w.step || 1].toLowerCase(), ready: 'Ready to sign', booked: 'Signing booked', complete: 'Complete' }[w.stage];
      r.push({ i: 'i-doc', n: 'Islamic Will', s: t, ok: w.stage === 'complete' });
    }
    if (v) {
      var k = v.next.kind, vs = v.billing ? 'Payment needed' : k === 'done' ? 'Up to date' : k === 'start' ? 'Ready to set up' : 'In progress';
      r.push({ i: 'i-vault', n: 'My Vault', s: vs, ok: k === 'done' && !v.billing, href: 'vault.html#/overview' });
    }
    return r;
  }

  // One recommendation, or none.
  function recommendation(st, f) {
    var w = st.will, v = st.vault;
    if (f.urgent || (f.kind === 'do' && f.about === 'will')) return null;           // finish what matters first
    if (!w) return { eb: 'Islamic Will · free', h: 'Ready to create your Islamic Will?', p: 'It’s free to create and print.', cta: 'Create your free Will', soon: 'My Will', art: 'family' };
    if (!v) return { eb: 'Expand your estate plan', h: 'There’s more you can keep protected.', p: 'See what My Vault can help you organize.', cta: 'See how it works', href: 'vault.html#/discover', art: 'vault' };
    if (v.reviewDue && f.kind === 'done') return { eb: 'Yearly review', h: 'Time for your yearly review.', p: 'Check that everything is still right.', cta: 'Review my Vault', href: 'vault.html#/overview', art: 'family' };
    return null;
  }

  function rowsHTML(rows) {
    return rows.map(function (x) {
      return '<a class="row" href="' + (x.href || '#') + '"' + (x.href ? '' : ' data-soon="My Will"') + '><span class="ri">' + ic(x.i, 22) + '</span><span><b>' + x.n + '</b><small class="t-' + (x.ok ? 'ok' : 'gold') + '">' + ic(x.ok ? 'i-check' : 'i-clock', 16) + x.s + '</small></span><span class="rc">' + ic('i-chev', 18) + '</span></a>';
    }).join('');
  }
  function action(o, cls) {
    return (o.href ? '<a class="' + cls + '" href="' + o.href + '">' : '<button class="' + cls + '" type="button" data-soon="' + (o.soon || 'This') + '">') + MW.esc(o.cta) + ' ' + ic('i-arrow', 18) + (o.href ? '</a>' : '</button>');
  }

  function render(key) {
    var st = STATES[key].live ? liveState() : STATES[key], f = primary(st), rows = planRows(st), s = recommendation(st, f);
    var tone = f.tone || 'gold';
    var h = '<h1 class="greet">' + (st.first ? 'Welcome, Nisreen.' : 'Welcome back, Nisreen.') + '</h1>';

    h += '<section class="focus' + (tone === 'warn' ? ' warn' : '') + '" aria-label="What to do next"><div class="tx">' +
      '<p class="lab t-' + tone + (f.chip ? ' chip' : '') + '">' + ic(f.li, 18) + f.lab + '</p><h2>' + MW.esc(f.h) + '</h2>';
    if (f.step != null) h += '<ol class="steps">' + REVIEW.map(function (x, i) { var c = i < f.step ? 'd' : i === f.step ? 'c' : ''; return '<li class="' + c + '"' + (c === 'c' ? ' aria-current="step"' : '') + '><span class="dot">' + (c === 'd' ? ic('i-check', 11) : '') + '</span>' + x + '</li>'; }).join('') + '</ol>';
    if (f.p) h += '<p class="sup">' + MW.esc(f.p) + '</p>';
    if (f.seg != null) { var b = ''; for (var i = 0; i < 6; i++) b += '<i' + (i < f.seg ? ' class="d"' : '') + '></i>'; h += '<div class="seg" aria-hidden="true">' + b + '</div><p class="segt">' + f.seg + ' of 6 chapters done</p>'; }
    h += '</div>';
    if (f.cta) h += '<div class="acts">' + action(f, 'btn') + '</div>';
    h += '</section>';

    var showPlan = rows.length > 1;
    if (showPlan || s) {
      h += '<div class="lower">';
      if (showPlan) h += '<section class="block" aria-labelledby="plan-t"><h3 id="plan-t">Your plan</h3><div class="rows">' + rowsHTML(rows) + '</div></section>';
      // the recommendation gets the solid button only when the primary card has no action of its own
      if (s) h += '<section class="sugg art-' + s.art + '" aria-label="Suggestion"><span class="art" aria-hidden="true"></span><div class="tx"><p class="eb">' + s.eb + '</p><h3>' + s.h + '</h3><p>' + s.p + '</p>' + action(s, f.cta ? 'lnk' : 'btn') + '</div></section>';
      h += '</div>';
    }
    document.getElementById('home').innerHTML = h;

    // Shared shell. On Home the sidebar shows the four destinations only; Vault sections appear once you are inside My Vault.
    var will = rows.filter(function (r) { return r.n === 'Islamic Will'; })[0];
    document.getElementById('sidebar').innerHTML = MW.sidebar({ active: 'home', willStatus: will ? will.s : 'Free', willPending: !!(st.will && st.will.stage !== 'complete'), vault: { subscribed: !!st.vault } });
    document.getElementById('topbar').innerHTML = MW.topbar({ crumbs: [{ label: 'Home' }], alert: !!f.urgent });
    document.getElementById('sb-demo').innerHTML = '<label for="state">Prototype · preview state</label><select id="state">' + Object.keys(STATES).map(function (k) { return '<option value="' + k + '"' + (k === key ? ' selected' : '') + '>' + STATES[k].label + '</option>'; }).join('') + '</select>';
  }

  MW.sprite();
  var start = (location.search.match(/[?&]state=([a-z]+)/) || [])[1];
  if (!STATES[start]) start = 'live';
  document.addEventListener('change', function (e) { if (e.target.id === 'state') { history.replaceState(null, '', '?state=' + e.target.value); render(e.target.value); } });
  document.addEventListener('click', function (e) {
    var soon = e.target.closest('[data-soon]');
    if (soon) { e.preventDefault(); MW.toast(soon.getAttribute('data-soon') + ' isn’t part of this prototype yet'); }
  });
  render(start);
})();
</script>
</body>
</html>
